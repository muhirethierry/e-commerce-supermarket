databases:
  - name: freshmart-db
    databaseName: freshmart
    user: freshmart
    plan: free # Temporary demo database; Render free Postgres expires after 30 days.
    region: frankfurt

services:
  - type: web
    name: freshmart-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: freshmart-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://freshmart-store.onrender.com # Update if Render assigns a different static-site URL.
      - key: FRONTEND_BASE_URL
        value: https://freshmart-store.onrender.com # Keep this in sync with CORS_ORIGINS.

  - type: web
    name: freshmart-store
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: freshmart-api
          envVarKey: RENDER_EXTERNAL_URL
